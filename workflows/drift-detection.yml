name: Drift detection

# Nightly: plan with -detailed-exitcode.
# Exit 2 = drift. Opens/updates a GitHub issue — no auto-remediation.
# Manual changes in the console are a finding, not a fix.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  TF_VERSION: "1.9.8"
  AWS_REGION: us-east-1

jobs:
  drift:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS (OIDC, read-only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_READONLY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Check drift
        id: drift
        working-directory: terraform/envs/${{ matrix.env }}
        run: |
          terraform init -input=false
          terraform plan -detailed-exitcode -no-color -input=false || echo "exit=$?" >> $GITHUB_OUTPUT
      - name: Open drift issue
        if: steps.drift.outputs.exit == '2'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Drift detected: ${{ matrix.env }} (${new Date().toISOString().slice(0,10)})`,
              body: 'Nightly `terraform plan` shows changes outside Terraform. Investigate in the console / CloudTrail, then fix via PR — do not apply from a laptop.',
              labels: ['drift', 'terraform']
            });
