name: Security scans

# Runs on every PR + weekly. All tools are free / open-source.
# Fails the PR on HIGH/CRITICAL — fix the code, don't suppress blindly.
# Suppressions go in .trivyignore / .checkov.yml with a reason + expiry.

on:
  pull_request:
    paths: ["terraform/**", "bootstrap/**"]
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy IaC scan (tfsec + misconfig rules)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: config
          scan-ref: terraform/
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: false

      - name: Gitleaks (secrets in git history)
        uses: gitleaks/gitleaks-action@v2
