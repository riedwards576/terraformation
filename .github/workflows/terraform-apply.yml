name: Terraform Apply

# Merge to main applies dev automatically.
# Prod applies only via manual dispatch + GitHub Environment approval.
# Two separate AWS roles enforce this: dev role cannot touch prod state.
#
# PlanGuard gate (the novel piece): before applying, this job
# 1. downloads the attestation from the latest successful PR run,
# 2. re-plans, 3. refuses to apply unless the fresh plan hashes to
#    the attested hash, 4. applies *that verified plan file* — not a
#    second, unverified apply. Fail closed if no attestation exists.
# This only holds if main is protected (PR merges only). Set that in
# Settings > Branches > main > Require a pull request before merging.

on:
  push:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to apply"
        type: choice
        required: true
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write
  actions: read # to download the PlanGuard attestation artifact

env:
  TF_VERSION: "1.9.8"
  AWS_REGION: us-east-1

jobs:
  apply-dev:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS (OIDC, dev apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Find latest attested PR run
        id: find-run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'terraform-pr.yml', status: 'success', per_page: 1
            });
            if (!runs.data.workflow_runs.length) {
              core.setFailed('PlanGuard: no successful PR run found — refusing to apply without an attestation.');
              return;
            }
            core.setOutput('run_id', runs.data.workflow_runs[0].id);
      - name: Download PlanGuard attestation
        uses: actions/download-artifact@v4
        with:
          name: planguard-dev
          path: terraform/envs/dev/
          run-id: ${{ steps.find-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: PlanGuard verify, then apply the verified plan
        working-directory: terraform/envs/dev
        run: |
          terraform init -input=false
          terraform plan -no-color -input=false -out=tfplan
          terraform show -json tfplan > fresh-plan.json
          python3 ../../../tools/planguard/planguard.py verify \
            --plan fresh-plan.json --attestation attestation.json
          terraform apply -input=false tfplan

  apply-prod:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'
    runs-on: ubuntu-latest
    environment: prod # <- set Required reviewers in GitHub: Settings > Environments > prod
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS (OIDC, prod apply role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Find latest attested PR run
        id: find-run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'terraform-pr.yml', status: 'success', per_page: 1
            });
            if (!runs.data.workflow_runs.length) {
              core.setFailed('PlanGuard: no successful PR run found — refusing to apply without an attestation.');
              return;
            }
            core.setOutput('run_id', runs.data.workflow_runs[0].id);
      - name: Download PlanGuard attestation
        uses: actions/download-artifact@v4
        with:
          name: planguard-prod
          path: terraform/envs/prod/
          run-id: ${{ steps.find-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: PlanGuard verify, then apply the verified plan
        working-directory: terraform/envs/prod
        run: |
          terraform init -input=false
          terraform plan -no-color -input=false -out=tfplan
          terraform show -json tfplan > fresh-plan.json
          python3 ../../../tools/planguard/planguard.py verify \
            --plan fresh-plan.json --attestation attestation.json
          terraform apply -input=false tfplan
